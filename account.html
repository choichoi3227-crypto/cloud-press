<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 계정 | CloudPress</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="flex h-screen bg-[#050505] text-white">
    <script>
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/login.html';
    </script>

    <!-- Sidebar -->
    <aside class="w-64 border-r border-white/10 p-6 flex flex-col">
        <div class="text-2xl font-black text-blue-500 mb-10">CLOUD<span class="text-white">PRESS</span></div>
        <nav class="flex-1 space-y-2">
            <a href="/dashboard.html" class="block p-3 rounded-xl hover:bg-white/5 transition"><i class="fas fa-tachometer-alt mr-3"></i> 대시보드</a>
            <a href="/hosting.html"   class="block p-3 rounded-xl hover:bg-white/5 transition"><i class="fas fa-globe mr-3"></i> 내 호스팅</a>
            <a href="/traffic.html"   class="block p-3 rounded-xl hover:bg-white/5 transition"><i class="fas fa-chart-line mr-3"></i> 트래픽</a>
            <a href="/storage.html"   class="block p-3 rounded-xl hover:bg-white/5 transition"><i class="fas fa-hdd mr-3"></i> 스토리지</a>
            <a href="/account.html"   class="block p-3 rounded-xl bg-white/10 font-bold"><i class="fas fa-user-circle mr-3"></i> 내 계정</a>
        </nav>
        <button onclick="logout()" class="mt-auto w-full bg-red-600 py-3 rounded-xl font-bold hover:bg-red-500 transition">
            <i class="fas fa-sign-out-alt mr-2"></i> 로그아웃
        </button>
    </aside>

    <main class="flex-1 p-10 max-w-2xl overflow-y-auto">
        <h1 class="text-3xl font-bold mb-10">내 계정 설정</h1>

        <div id="alertMsg" class="hidden mb-6 p-3 rounded-xl text-sm text-center"></div>

        <div class="space-y-6">
            <div class="space-y-2">
                <label class="text-sm text-gray-500">이메일</label>
                <input type="email" id="user-email-display"
                    class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-400 cursor-not-allowed"
                    disabled placeholder="로딩 중...">
            </div>
            <div class="space-y-2">
                <label class="text-sm text-gray-500">역할</label>
                <input type="text" id="user-role-display"
                    class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-400 cursor-not-allowed"
                    disabled placeholder="로딩 중...">
            </div>
            <div class="space-y-2">
                <label class="text-sm text-gray-500">Cloudflare Global API Key</label>
                <input type="password" id="cf_api"
                    class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 transition"
                    placeholder="API 키를 입력하세요">
                <p id="cfkey-status" class="text-xs text-gray-600 ml-1"></p>
            </div>
            <button onclick="saveProfile()"
                class="bg-blue-600 px-8 py-3 rounded-full text-white font-bold hover:bg-blue-500 transition">
                설정 저장
            </button>
        </div>
    </main>

    <script src="/src/auth-frontend.js"></script>
    <script>
        const TOKEN = localStorage.getItem('admin_token');
        const HEADERS = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };

        function showAlert(msg, type = 'success') {
            const el = document.getElementById('alertMsg');
            el.textContent = msg;
            el.className = type === 'success'
                ? 'mb-6 p-3 rounded-xl text-sm text-center bg-green-900/40 border border-green-500/40 text-green-400'
                : 'mb-6 p-3 rounded-xl text-sm text-center bg-red-900/40 border border-red-500/40 text-red-400';
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }

        async function loadAccountInfo() {
            try {
                const res = await fetch('/api/account', { headers: HEADERS });
                if (res.status === 401) {
                    localStorage.removeItem('admin_token');
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                if (data.email) {
                    document.getElementById('user-email-display').value = data.email;
                    document.getElementById('user-role-display').value = data.role || 'user';
                    document.getElementById('cfkey-status').textContent =
                        data.hasCfKey ? '✓ API 키가 저장되어 있습니다.' : '아직 API 키가 없습니다.';
                }
            } catch (e) {
                console.error('[account] 로드 실패:', e);
                showAlert('계정 정보를 불러오지 못했습니다.', 'error');
            }
        }

        async function saveProfile() {
            const cfApiKey = document.getElementById('cf_api').value.trim();
            if (!cfApiKey) {
                showAlert('저장할 API 키를 입력해주세요.', 'error');
                return;
            }
            try {
                const res = await fetch('/api/account', {
                    method: 'PUT',
                    headers: HEADERS,
                    body: JSON.stringify({ cf_api_key: cfApiKey }),
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    document.getElementById('cf_api').value = '';
                    document.getElementById('cfkey-status').textContent = '✓ API 키가 저장되어 있습니다.';
                    showAlert('설정이 저장되었습니다.');
                } else {
                    showAlert(data.error || '저장에 실패했습니다.', 'error');
                }
            } catch (e) {
                console.error('[account] 저장 실패:', e);
                showAlert('저장 중 오류가 발생했습니다.', 'error');
            }
        }

        loadAccountInfo();
    </script>
</body>
</html>
