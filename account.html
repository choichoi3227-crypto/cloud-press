<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 계정 | CloudPress</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen bg-black text-white">
    <!-- 사이드바 동일 -->
    <main class="flex-1 p-10 max-w-2xl">
        <h1 class="text-3xl font-bold mb-10">내 계정 설정</h1>
        <div class="space-y-6">
            <div class="space-y-2">
                <label class="text-sm text-gray-500">Cloudflare Global API Key</label>
                <input type="password" id="cf_api" class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500" placeholder="API 키를 입력하세요">
            </div>
            <button onclick="saveProfile()" class="bg-white text-black px-8 py-3 rounded-full font-bold">설정 저장</button>
        </div>
    </main>
</body>
</html>
