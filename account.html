<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 계정 | CloudPress</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white md:flex md:h-screen">
    <script>
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/login.html';

    <main class="flex-1 w-full p-10 max-w-2xl overflow-y-auto">
        <h1 class="text-3xl font-bold mb-10">내 계정 설정</h1>

        <div id="alertMsg" class="hidden mb-6 p-3 rounded-xl text-sm text-center"></div>

        <div class="space-y-8">
            <!-- 계정 정보 -->
            <div class="p-6 bg-white/5 border border-white/10 rounded-2xl space-y-4">
                <h2 class="text-lg font-bold mb-2 flex items-center gap-2">
                    <i class="fas fa-user text-blue-400"></i> 계정 정보
                </h2>
                <div class="space-y-2">
                    <label class="text-sm text-gray-500">이메일</label>
                    <input type="email" id="user-email-display"
                        class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-400 cursor-not-allowed"
                        disabled placeholder="로딩 중...">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-sm text-gray-500">역할</label>
                        <input type="text" id="user-role-display"
                            class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-400 cursor-not-allowed"
                            disabled placeholder="로딩 중...">
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm text-gray-500">플랜</label>
                        <input type="text" id="user-plan-display"
                            class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-400 cursor-not-allowed"
                            disabled placeholder="로딩 중...">
                    </div>
                </div>
            </div>

            <!-- Cloudflare API 설정 -->
            <div class="p-6 bg-white/5 border border-white/10 rounded-2xl space-y-4">
                <h2 class="text-lg font-bold mb-2 flex items-center gap-2">
                    <i class="fab fa-cloudflare text-orange-400"></i> Cloudflare 연동
                </h2>
                <p class="text-xs text-gray-500 mb-4">
                    Cloudflare Global API Key는 <a href="https://dash.cloudflare.com/profile/api-tokens" target="_blank" class="text-blue-400 underline">Cloudflare 대시보드 → 내 프로필 → API 토큰</a>에서 확인할 수 있습니다.
                </p>

                <!-- 저장된 상태 배너 -->
                <div id="cfkey-saved-banner" class="hidden p-3 bg-green-900/30 border border-green-500/30 rounded-xl text-green-400 text-sm flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <i class="fas fa-check-circle"></i>
                        <span>Cloudflare API 키가 연동되어 있습니다.</span>
                        <span id="cfkey-email-saved" class="text-green-300 ml-1"></span>
                    </div>
                    <button onclick="showCfKeyForm()" class="text-xs text-orange-300 hover:text-orange-200 underline flex-shrink-0">
                        키 변경
                    </button>
                </div>

                <!-- CF 키 입력 폼 (저장 안 됐을 때만 기본 표시) -->
                <div id="cfkey-form" class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-sm text-gray-400">Cloudflare 계정 이메일 <span class="text-red-400">*</span></label>
                        <input type="email" id="cf_email"
                            class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-orange-400 transition"
                            placeholder="cloudflare@example.com">
                        <p class="text-xs text-gray-600 ml-1">Cloudflare에 로그인한 이메일 주소</p>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm text-gray-400">Global API Key <span class="text-red-400">*</span></label>
                        <div class="relative">
                            <input type="password" id="cf_api"
                                class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-orange-400 transition pr-12"
                                placeholder="API 키를 입력하세요">
                            <button onclick="toggleApiKeyVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition">
                                <i id="eye-icon" class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div id="validate-status" class="hidden p-3 rounded-xl text-sm flex items-center gap-2"></div>

                    <div class="flex gap-3">
                        <button onclick="validateAndSave()" id="save-btn"
                            class="flex-1 bg-orange-600 px-8 py-3 rounded-xl text-white font-bold hover:bg-orange-500 transition flex items-center justify-center gap-2">
                            <i class="fas fa-shield-check"></i> 검증 후 저장
                        </button>
                        <button onclick="clearCfKey()"
                            class="px-6 py-3 rounded-xl border border-white/20 text-gray-400 font-bold hover:bg-white/5 transition text-sm">
                            초기화
                        </button>
                    </div>
                </div>
            </div>

            <!-- 비밀번호 변경 -->
            <div class="p-6 bg-white/5 border border-white/10 rounded-2xl space-y-4">
                <h2 class="text-lg font-bold mb-2 flex items-center gap-2">
                    <i class="fas fa-lock text-purple-400"></i> 비밀번호 변경
                </h2>
                <div class="space-y-3">
                    <input type="password" id="pw_current"
                        class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-purple-500 transition"
                        placeholder="현재 비밀번호">
                    <input type="password" id="pw_new"
                        class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-purple-500 transition"
                        placeholder="새 비밀번호 (8자 이상)">
                    <input type="password" id="pw_confirm"
                        class="w-full p-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-purple-500 transition"
                        placeholder="새 비밀번호 확인">
                </div>
                <button onclick="changePassword()"
                    class="bg-purple-700 px-8 py-3 rounded-xl text-white font-bold hover:bg-purple-600 transition">
                    비밀번호 변경
                </button>
            </div>
        </div>
    </main>

    <script src="/src/auth-frontend.js"></script>
    <script>
        const TOKEN   = localStorage.getItem('admin_token');
        const HEADERS = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };

        function showAlert(msg, type = 'success') {
            const el = document.getElementById('alertMsg');
            el.textContent = msg;
            el.className = type === 'success'
                ? 'mb-6 p-3 rounded-xl text-sm text-center bg-green-900/40 border border-green-500/40 text-green-400'
                : 'mb-6 p-3 rounded-xl text-sm text-center bg-red-900/40 border border-red-500/40 text-red-400';
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 4000);
        }

        function setValidateStatus(msg, type) {
            const el = document.getElementById('validate-status');
            el.classList.remove('hidden');
            if (type === 'loading') {
                el.className = 'p-3 rounded-xl text-sm flex items-center gap-2 bg-blue-900/30 border border-blue-500/30 text-blue-300';
                el.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${msg}`;
            } else if (type === 'success') {
                el.className = 'p-3 rounded-xl text-sm flex items-center gap-2 bg-green-900/30 border border-green-500/30 text-green-400';
                el.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
            } else {
                el.className = 'p-3 rounded-xl text-sm flex items-center gap-2 bg-red-900/30 border border-red-500/30 text-red-400';
                el.innerHTML = `<i class="fas fa-times-circle"></i> ${msg}`;
            }
        }

        function toggleApiKeyVisibility() {
            const input = document.getElementById('cf_api');
            const icon  = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function loadAccountInfo() {
            try {
                const res  = await fetch('/api/account', { headers: HEADERS });
                if (res.status === 401) {
                    localStorage.removeItem('admin_token');
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                if (data.email) {
                    document.getElementById('user-email-display').value = data.email;

                    const roleMap = { admin: '관리자 (Admin)', user: '일반 사용자' };
                    document.getElementById('user-role-display').value = roleMap[data.role] || data.role;

                    const planMap = { pro: 'Pro (최상급)', starter: 'Starter', free: '무료' };
                    document.getElementById('user-plan-display').value = planMap[data.plan] || data.plan || '무료';

                    if (data.hasCfKey) {
                        const banner = document.getElementById('cfkey-saved-banner');
                        banner.classList.remove('hidden');
                        if (data.cfEmail) {
                            document.getElementById('cfkey-email-saved').textContent = `(${data.cfEmail})`;
                        }
                        // 이미 저장된 경우 입력 폼 숨기기
                        const form = document.getElementById('cfkey-form');
                        if (form) form.classList.add('hidden');
                    }
                }
            } catch (e) {
                console.error('[account] 로드 실패:', e);
                showAlert('계정 정보를 불러오지 못했습니다.', 'error');
            }
        }

        async function validateAndSave() {
            const cfEmail  = document.getElementById('cf_email').value.trim();
            const cfApiKey = document.getElementById('cf_api').value.trim();

            if (!cfEmail) {
                showAlert('Cloudflare 계정 이메일을 입력해주세요.', 'error');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cfEmail)) {
                showAlert('올바른 이메일 형식이 아닙니다.', 'error');
                return;
            }
            if (!cfApiKey) {
                showAlert('Cloudflare Global API Key를 입력해주세요.', 'error');
                return;
            }

            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 검증 중...';
            setValidateStatus('Cloudflare API 키를 검증하고 있습니다...', 'loading');

            try {
                const res  = await fetch('/api/account', {
                    method:  'PUT',
                    headers: HEADERS,
                    body:    JSON.stringify({ cf_api_key: cfApiKey, cf_email: cfEmail }),
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    setValidateStatus('API 키 검증 성공! 저장되었습니다.', 'success');
                    document.getElementById('cf_api').value   = '';
                    document.getElementById('cf_email').value = '';
                    document.getElementById('cfkey-saved-banner').classList.remove('hidden');
                    document.getElementById('cfkey-email-saved').textContent = `(${cfEmail})`;
                    // 저장 후 입력 폼 숨기기
                    const form = document.getElementById('cfkey-form');
                    if (form) form.classList.add('hidden');
                    showAlert('Cloudflare API 키가 검증되어 저장되었습니다.');
                } else {
                    setValidateStatus(data.error || '검증에 실패했습니다.', 'error');
                    showAlert(data.error || '저장에 실패했습니다.', 'error');
                }
            } catch (e) {
                setValidateStatus('네트워크 오류가 발생했습니다.', 'error');
                showAlert('저장 중 오류가 발생했습니다.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-shield-check"></i> 검증 후 저장';
            }
        }

        function clearCfKey() {
            document.getElementById('cf_email').value = '';
            document.getElementById('cf_api').value   = '';
            document.getElementById('validate-status').classList.add('hidden');
        }

        // 이미 저장된 키를 변경할 때 폼 펼치기
        function showCfKeyForm() {
            const form = document.getElementById('cfkey-form');
            if (form) form.classList.remove('hidden');
        }

        async function changePassword() {
            const current = document.getElementById('pw_current').value;
            const newPw   = document.getElementById('pw_new').value;
            const confirm = document.getElementById('pw_confirm').value;

            if (!current || !newPw || !confirm) {
                showAlert('모든 필드를 입력해주세요.', 'error');
                return;
            }
            if (newPw.length < 8) {
                showAlert('새 비밀번호는 8자 이상이어야 합니다.', 'error');
                return;
            }
            if (newPw !== confirm) {
                showAlert('새 비밀번호가 일치하지 않습니다.', 'error');
                return;
            }

            try {
                const res  = await fetch('/api/account/password', {
                    method:  'PUT',
                    headers: HEADERS,
                    body:    JSON.stringify({ current_password: current, new_password: newPw }),
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showAlert('비밀번호가 변경되었습니다.');
                    document.getElementById('pw_current').value = '';
                    document.getElementById('pw_new').value     = '';
                    document.getElementById('pw_confirm').value = '';
                } else {
                    showAlert(data.error || '비밀번호 변경에 실패했습니다.', 'error');
                }
            } catch (e) {
                showAlert('오류가 발생했습니다.', 'error');
            }
        }

        loadAccountInfo();
    </script>
    <script src="/src/sidebar.js"></script>
</body>
</html>
