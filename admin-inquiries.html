<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 관리 — CloudPress Admin</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white md:flex md:h-screen">
<script>
    const _at = localStorage.getItem('admin_token');
    if (!_at) window.location.href = '/login.html';
</script>

<!-- 모바일 헤더 -->
<header class="md:hidden sticky top-0 z-50 bg-[#050505]/95 backdrop-blur-lg border-b border-white/10">
    <div class="flex justify-between items-center px-4 py-3">
        <span class="text-xl font-black text-blue-500">CP <span class="text-white">ADMIN</span></span>
        <button id="mobileMenuBtn" class="text-gray-400 hover:text-white p-2"><i class="fas fa-bars text-xl"></i></button>
    </div>
    <div id="mobileMenu" class="hidden border-t border-white/10 py-2 px-2 space-y-1">
        <a href="/admin.html"            class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-400"><i class="fas fa-chart-line w-5"></i> 개요</a>
        <a href="/admin-users.html"      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-400"><i class="fas fa-users w-5"></i> 사용자 관리</a>
        <a href="/admin-sites.html"      class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-400"><i class="fas fa-globe w-5"></i> 사이트 관리</a>
        <a href="/admin-inquiries.html"  class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white/10 font-bold"><i class="fas fa-comments w-5"></i> 문의 관리</a>
        <a href="/admin-settings.html"   class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-400"><i class="fas fa-cog w-5"></i> 시스템 설정</a>
        <div class="border-t border-white/10 mt-2 pt-2">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-900/20 transition"><i class="fas fa-sign-out-alt w-5"></i> 로그아웃</button>
        </div>
    </div>
</header>
<script>document.getElementById('mobileMenuBtn').addEventListener('click',()=>document.getElementById('mobileMenu').classList.toggle('hidden'));</script>

<!-- 사이드바 -->
<aside class="w-64 border-r border-white/10 p-6 flex flex-col hidden md:flex flex-shrink-0">
    <div class="text-2xl font-black text-blue-500 mb-10">CP <span class="text-white">ADMIN</span></div>
    <nav class="flex-1 space-y-1">
        <a href="/admin.html"            class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-chart-line w-5 text-center"></i> 개요</a>
        <a href="/admin-users.html"      class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-users w-5 text-center"></i> 사용자 관리</a>
        <a href="/admin-sites.html"      class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-globe w-5 text-center"></i> 사이트 관리</a>
        <a href="/admin-inquiries.html"  class="flex items-center gap-3 p-3 rounded-xl bg-white/10 font-bold text-sm"><i class="fas fa-comments w-5 text-center"></i> 문의 관리</a>
        <a href="/admin-settings.html"   class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-cog w-5 text-center"></i> 시스템 설정</a>
    </nav>
    <button onclick="logout()" class="mt-auto w-full bg-red-600/20 border border-red-500/30 text-red-400 py-3 rounded-xl font-bold hover:bg-red-600/30 transition text-sm">
        <i class="fas fa-sign-out-alt mr-2"></i> 로그아웃
    </button>
</aside>

<main class="flex-1 w-full overflow-y-auto p-6 md:p-10 space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold">문의 관리</h1>
            <p class="text-sm text-gray-400 mt-1">사용자 문의를 확인하고 답변을 관리합니다.</p>
        </div>
        <button onclick="loadInquiries()" class="text-sm text-gray-400 hover:text-white transition">
            <i class="fas fa-sync-alt mr-1"></i> 새로고침
        </button>
    </div>

    <!-- 통계 카드 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="bg-[#111] border border-white/5 rounded-2xl p-5 text-center">
            <div class="text-3xl font-bold text-white" id="stat-total">-</div>
            <div class="text-xs text-gray-500 mt-1">전체 문의</div>
        </div>
        <div class="bg-[#111] border border-yellow-500/20 rounded-2xl p-5 text-center">
            <div class="text-3xl font-bold text-yellow-400" id="stat-open">-</div>
            <div class="text-xs text-gray-500 mt-1">미답변</div>
        </div>
        <div class="bg-[#111] border border-green-500/20 rounded-2xl p-5 text-center">
            <div class="text-3xl font-bold text-green-400" id="stat-replied">-</div>
            <div class="text-xs text-gray-500 mt-1">답변 완료</div>
        </div>
        <div class="bg-[#111] border border-white/5 rounded-2xl p-5 text-center">
            <div class="text-3xl font-bold text-gray-400" id="stat-closed">-</div>
            <div class="text-xs text-gray-500 mt-1">종료</div>
        </div>
    </div>

    <!-- 필터 탭 -->
    <div class="flex gap-2 flex-wrap">
        <button onclick="filterStatus('')"       id="filter-all"     class="filter-btn px-4 py-2 rounded-xl text-sm font-bold bg-white/10 text-white transition">전체</button>
        <button onclick="filterStatus('open')"   id="filter-open"    class="filter-btn px-4 py-2 rounded-xl text-sm font-bold text-gray-400 hover:bg-white/5 transition">미답변</button>
        <button onclick="filterStatus('replied')"id="filter-replied"  class="filter-btn px-4 py-2 rounded-xl text-sm font-bold text-gray-400 hover:bg-white/5 transition">답변 완료</button>
        <button onclick="filterStatus('closed')" id="filter-closed"   class="filter-btn px-4 py-2 rounded-xl text-sm font-bold text-gray-400 hover:bg-white/5 transition">종료</button>
    </div>

    <!-- 문의 목록 -->
    <div id="inquiry-list" class="space-y-3">
        <div class="text-center py-10 text-gray-500"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
    </div>

    <!-- 페이지네이션 -->
    <div id="pagination" class="flex justify-center gap-2"></div>
</main>

<!-- 문의 상세 모달 -->
<div id="inquiry-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur hidden">
    <div class="bg-[#111] border border-white/10 rounded-2xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between p-6 border-b border-white/10">
            <h2 class="text-lg font-bold">문의 상세</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl">&times;</button>
        </div>
        <div id="modal-content" class="p-6 space-y-5"></div>
    </div>
</div>

<script>
const HEADERS = () => ({ 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('admin_token')}` });
let currentStatus = '';
let currentPage = 1;
let totalInquiries = 0;

async function loadInquiries(page = 1) {
    currentPage = page;
    const params = new URLSearchParams({ page });
    if (currentStatus) params.set('status', currentStatus);

    const list = document.getElementById('inquiry-list');
    list.innerHTML = '<div class="text-center py-10 text-gray-500"><i class="fas fa-spinner fa-spin text-2xl"></i></div>';

    try {
        const res  = await fetch(`/api/admin/inquiries?${params}`, { headers: HEADERS() });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);

        totalInquiries = data.total || 0;
        updateStats(data);
        renderList(data.inquiries || []);
        renderPagination(data.total, data.limit, page);
    } catch (e) {
        list.innerHTML = `<div class="text-center py-10 text-red-400">오류: ${e.message}</div>`;
    }
}

function updateStats(data) {
    document.getElementById('stat-total').textContent = data.total ?? '-';
    document.getElementById('stat-open').textContent = data.open_count ?? '-';
    // 별도 집계가 없으므로 open_count 기반 추정
}

async function loadAllStats() {
    try {
        const [all, replied, closed] = await Promise.all([
            fetch(`/api/admin/inquiries?page=1`, { headers: HEADERS() }).then(r=>r.json()),
            fetch(`/api/admin/inquiries?page=1&status=replied`, { headers: HEADERS() }).then(r=>r.json()),
            fetch(`/api/admin/inquiries?page=1&status=closed`, { headers: HEADERS() }).then(r=>r.json()),
        ]);
        document.getElementById('stat-total').textContent   = all.total ?? 0;
        document.getElementById('stat-open').textContent    = all.open_count ?? 0;
        document.getElementById('stat-replied').textContent = replied.total ?? 0;
        document.getElementById('stat-closed').textContent  = closed.total ?? 0;
    } catch {}
}

function renderList(items) {
    const list = document.getElementById('inquiry-list');
    if (!items.length) {
        list.innerHTML = '<div class="text-center py-16 text-gray-500"><i class="fas fa-inbox text-4xl mb-3 block"></i>문의가 없습니다.</div>';
        return;
    }
    list.innerHTML = items.map(inq => `
        <div onclick="openModal(${inq.id})"
             class="bg-[#111] border ${statusBorder(inq.status)} rounded-2xl p-5 cursor-pointer hover:border-blue-500/50 transition group">
            <div class="flex items-start justify-between gap-3">
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full font-bold ${statusBadge(inq.status)}">
                            ${statusIcon(inq.status)} ${statusLabel(inq.status)}
                        </span>
                        <span class="text-xs text-gray-600">#${inq.id}</span>
                    </div>
                    <div class="font-bold truncate group-hover:text-blue-400 transition">
                        ${escHtml(inq.subject || '(제목 없음)')}
                    </div>
                    <div class="text-sm text-gray-400 mt-1 truncate">${escHtml(inq.message)}</div>
                    <div class="flex gap-3 mt-2 text-xs text-gray-600">
                        <span><i class="fas fa-user mr-1"></i>${escHtml(inq.name)}</span>
                        <span><i class="fas fa-envelope mr-1"></i>${escHtml(inq.email)}</span>
                        <span><i class="fas fa-clock mr-1"></i>${fmtDate(inq.created_at)}</span>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-gray-600 group-hover:text-blue-400 transition mt-1 flex-shrink-0"></i>
            </div>
        </div>
    `).join('');
}

function renderPagination(total, limit, page) {
    const pages = Math.ceil(total / limit);
    const el = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    for (let i = 1; i <= pages; i++) {
        html += `<button onclick="loadInquiries(${i})"
            class="w-9 h-9 rounded-xl text-sm font-bold transition ${i === page ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400 hover:bg-white/10'}">${i}</button>`;
    }
    el.innerHTML = html;
}

async function openModal(id) {
    document.getElementById('inquiry-modal').classList.remove('hidden');
    document.getElementById('modal-content').innerHTML = '<div class="text-center py-8 text-gray-500"><i class="fas fa-spinner fa-spin text-xl"></i></div>';
    try {
        const res  = await fetch(`/api/admin/inquiries?id=${id}`, { headers: HEADERS() });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        renderModal(data.inquiry);
    } catch (e) {
        document.getElementById('modal-content').innerHTML = `<p class="text-red-400">오류: ${e.message}</p>`;
    }
}

function renderModal(inq) {
    document.getElementById('modal-content').innerHTML = `
        <div class="space-y-1">
            <div class="flex gap-2 flex-wrap">
                <span class="text-xs px-2 py-1 rounded-full font-bold ${statusBadge(inq.status)}">${statusIcon(inq.status)} ${statusLabel(inq.status)}</span>
                <span class="text-xs text-gray-500">접수: ${fmtDate(inq.created_at)}</span>
                ${inq.replied_at ? `<span class="text-xs text-green-500">답변: ${fmtDate(inq.replied_at)}</span>` : ''}
            </div>
            <h3 class="text-xl font-bold mt-2">${escHtml(inq.subject || '(제목 없음)')}</h3>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-black/30 rounded-xl p-3">
                <div class="text-xs text-gray-500 mb-1">보낸 사람</div>
                <div class="font-bold">${escHtml(inq.name)}</div>
                <div class="text-sm text-gray-400">${escHtml(inq.email)}</div>
            </div>
            ${inq.user_id ? `<div class="bg-black/30 rounded-xl p-3"><div class="text-xs text-gray-500 mb-1">회원 ID</div><div class="font-mono text-sm">${inq.user_id}</div></div>` : ''}
        </div>

        <div>
            <div class="text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">문의 내용</div>
            <div class="bg-black/30 rounded-xl p-4 text-sm leading-relaxed whitespace-pre-wrap">${escHtml(inq.message)}</div>
        </div>

        ${inq.admin_reply ? `
        <div>
            <div class="text-xs text-green-400 mb-2 font-bold uppercase tracking-wider">기존 답변</div>
            <div class="bg-green-900/20 border border-green-500/20 rounded-xl p-4 text-sm leading-relaxed whitespace-pre-wrap">${escHtml(inq.admin_reply)}</div>
        </div>` : ''}

        <div>
            <div class="text-xs text-gray-500 mb-2 font-bold uppercase tracking-wider">답변 작성</div>
            <textarea id="modal-reply" rows="5"
                class="w-full bg-black/30 border border-white/10 rounded-xl p-4 text-sm resize-none outline-none focus:border-blue-500 transition"
                placeholder="사용자에게 보낼 답변을 작성하세요...">${escHtml(inq.admin_reply || '')}</textarea>
        </div>

        <div id="modal-alert" class="hidden p-3 rounded-xl text-sm"></div>

        <div class="flex gap-3 flex-wrap">
            <button onclick="submitReply(${inq.id})"
                class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">
                <i class="fas fa-reply mr-2"></i>답변 저장
            </button>
            <select onchange="changeStatus(${inq.id}, this.value)"
                class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none">
                <option value="">상태 변경</option>
                <option value="open" ${inq.status==='open'?'selected':''}>미답변</option>
                <option value="replied" ${inq.status==='replied'?'selected':''}>답변 완료</option>
                <option value="closed" ${inq.status==='closed'?'selected':''}>종료</option>
            </select>
            <button onclick="deleteInquiry(${inq.id})"
                class="bg-red-600/20 border border-red-500/30 text-red-400 font-bold px-4 py-3 rounded-xl hover:bg-red-600/30 transition text-sm">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    `;
}

async function submitReply(id) {
    const reply = document.getElementById('modal-reply').value.trim();
    if (!reply) { showModalAlert('답변 내용을 입력해주세요.', 'error'); return; }
    try {
        const res  = await fetch(`/api/admin/inquiries?id=${id}`, {
            method: 'PUT', headers: HEADERS(),
            body: JSON.stringify({ admin_reply: reply }),
        });
        const data = await res.json();
        if (data.success) {
            showModalAlert('답변이 저장되었습니다!', 'success');
            loadInquiries(currentPage);
        } else {
            showModalAlert(data.error || '저장 실패', 'error');
        }
    } catch (e) {
        showModalAlert('네트워크 오류: ' + e.message, 'error');
    }
}

async function changeStatus(id, status) {
    if (!status) return;
    try {
        const res  = await fetch(`/api/admin/inquiries?id=${id}`, {
            method: 'PUT', headers: HEADERS(),
            body: JSON.stringify({ status }),
        });
        const data = await res.json();
        if (data.success) { showModalAlert('상태가 변경되었습니다.', 'success'); loadInquiries(currentPage); }
        else showModalAlert(data.error || '변경 실패', 'error');
    } catch {}
}

async function deleteInquiry(id) {
    if (!confirm('문의를 삭제하시겠습니까?')) return;
    try {
        const res  = await fetch(`/api/admin/inquiries?id=${id}`, { method: 'DELETE', headers: HEADERS() });
        const data = await res.json();
        if (data.success) { closeModal(); loadInquiries(currentPage); }
        else showModalAlert(data.error || '삭제 실패', 'error');
    } catch {}
}

function showModalAlert(msg, type) {
    const el = document.getElementById('modal-alert');
    el.className = `p-3 rounded-xl text-sm ${type === 'success' ? 'bg-green-900/30 text-green-400 border border-green-500/20' : 'bg-red-900/30 text-red-400 border border-red-500/20'}`;
    el.textContent = msg;
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 4000);
}

function closeModal() { document.getElementById('inquiry-modal').classList.add('hidden'); }
document.getElementById('inquiry-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('inquiry-modal')) closeModal();
});

function filterStatus(status) {
    currentStatus = status;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('bg-white/10', 'text-white'));
    document.querySelectorAll('.filter-btn').forEach(b => { b.className = b.className.replace('bg-white/10 text-white', ''); b.classList.add('text-gray-400'); });
    const active = document.getElementById(`filter-${status || 'all'}`);
    if (active) { active.classList.add('bg-white/10', 'text-white'); active.classList.remove('text-gray-400'); }
    loadInquiries(1);
}

/* ── 유틸리티 ── */
function statusBorder(s) { return s==='open'?'border-yellow-500/30':s==='replied'?'border-green-500/30':'border-white/5'; }
function statusBadge(s)  { return s==='open'?'bg-yellow-500/20 text-yellow-300':s==='replied'?'bg-green-500/20 text-green-300':'bg-white/10 text-gray-400'; }
function statusLabel(s)  { return s==='open'?'미답변':s==='replied'?'답변 완료':'종료'; }
function statusIcon(s)   { return s==='open'?'●':s==='replied'?'✓':'✕'; }
function fmtDate(d)      { if (!d) return '-'; return new Date(d).toLocaleString('ko-KR', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function escHtml(s)      { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function logout() { localStorage.removeItem('admin_token'); window.location.href = '/login.html'; }

// 초기화
loadInquiries();
loadAllStats();
</script>
</body>
</html>
