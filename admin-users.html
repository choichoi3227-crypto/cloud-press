<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 관리 — CloudPress Admin</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white md:flex md:h-screen">
<script>
    const token = localStorage.getItem('admin_token');
    if (!token) window.location.href = '/login';
</script>

<!-- 모바일 헤더 -->
<header class="md:hidden sticky top-0 z-50 bg-[#050505]/95 backdrop-blur-lg border-b border-white/10">
    <div class="flex justify-between items-center px-4 py-3">
        <span class="text-xl font-black text-blue-500">CP <span class="text-white">ADMIN</span></span>
        <button id="mobileMenuBtn" class="text-gray-400 hover:text-white p-2"><i class="fas fa-bars text-xl"></i></button>
    </div>
    <div id="mobileMenu" class="hidden border-t border-white/10 py-2 px-2 space-y-1">
        <a href="/admin"          class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-400"><i class="fas fa-chart-line w-5 text-center"></i> 개요</a>
        <a href="/admin-users"    class="flex items-center gap-3 px-4 py-3 rounded-xl bg-white/10 font-bold"><i class="fas fa-users w-5 text-center"></i> 사용자 관리</a>
        <a href="/admin-sites"    class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-400"><i class="fas fa-globe w-5 text-center"></i> 사이트 관리</a>
        <a href="/admin-settings" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/5 transition text-gray-400"><i class="fas fa-cog w-5 text-center"></i> 시스템 설정</a>
        <div class="border-t border-white/10 mt-2 pt-2">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-900/20 transition"><i class="fas fa-sign-out-alt w-5 text-center"></i> 로그아웃</button>
        </div>
    </div>
</header>
<script>document.getElementById('mobileMenuBtn').addEventListener('click',()=>document.getElementById('mobileMenu').classList.toggle('hidden'));</script>

<!-- 사이드바 -->
<aside class="w-64 border-r border-white/10 p-6 flex flex-col hidden md:flex flex-shrink-0">
    <div class="text-2xl font-black text-blue-500 mb-10">CP <span class="text-white">ADMIN</span></div>
    <nav class="flex-1 space-y-1">
        <a href="/admin"          class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-chart-line w-5 text-center"></i> 개요</a>
        <a href="/admin-users"    class="flex items-center gap-3 p-3 rounded-xl bg-white/10 font-bold text-sm"><i class="fas fa-users w-5 text-center"></i> 사용자 관리</a>
        <a href="/admin-sites"    class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-globe w-5 text-center"></i> 사이트 관리</a>
        <a href="/admin-inquiries" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-comments w-5 text-center"></i> 문의 관리</a>
        <a href="/admin-notices"  class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-bullhorn w-5 text-center"></i> 공지 관리</a>
        <a href="/admin-settings" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition text-gray-400 text-sm"><i class="fas fa-cog w-5 text-center"></i> 시스템 설정</a>
    </nav>
    <button onclick="logout()" class="mt-auto w-full bg-red-600/20 border border-red-500/30 text-red-400 py-3 rounded-xl font-bold hover:bg-red-600/30 transition text-sm">
        <i class="fas fa-sign-out-alt mr-2"></i> 로그아웃
    </button>
</aside>

<main class="flex-1 w-full overflow-y-auto p-6 md:p-10">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
        <h1 class="text-2xl font-bold">사용자 관리</h1>
        <div class="flex gap-2">
            <input id="search-input" type="text" placeholder="이메일 검색..." onkeydown="if(event.key==='Enter')loadUsers()"
                class="p-2 px-4 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 text-sm w-56">
            <button onclick="loadUsers()" class="bg-blue-700 px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-600 transition">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </div>

    <div class="bg-[#111] rounded-2xl border border-white/5 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-white/10 text-gray-500 text-xs uppercase">
                        <th class="text-left p-4">이메일</th>
                        <th class="text-left p-4">역할</th>
                        <th class="text-left p-4">플랜</th>
                        <th class="text-left p-4">가입일</th>
                        <th class="text-left p-4">작업</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr><td colspan="5" class="text-center p-8 text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i>로딩 중...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="pagination" class="flex justify-center gap-2 p-4 border-t border-white/10"></div>
    </div>
</main>

<!-- 플랜 변경 모달 -->
<div id="edit-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#111] border border-white/10 rounded-2xl p-6 w-full max-w-sm space-y-4">
        <h3 class="font-bold text-lg">사용자 설정 변경</h3>
        <input type="hidden" id="edit-uid">
        <div>
            <label class="text-xs text-gray-400 mb-1 block">플랜</label>
            <select id="edit-plan" class="w-full p-3 bg-white/5 border border-white/10 rounded-xl outline-none text-sm">
                <option value="free">Free</option>
                <option value="starter">Starter</option>
                <option value="pro">Pro</option>
            </select>
        </div>
        <div>
            <label class="text-xs text-gray-400 mb-1 block">역할</label>
            <select id="edit-role" class="w-full p-3 bg-white/5 border border-white/10 rounded-xl outline-none text-sm">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <div class="flex gap-3">
            <button onclick="saveUser()" class="flex-1 bg-blue-700 py-2 rounded-xl font-bold text-sm hover:bg-blue-600 transition">저장</button>
            <button onclick="closeModal()" class="flex-1 bg-white/10 py-2 rounded-xl font-bold text-sm hover:bg-white/20 transition">취소</button>
        </div>
    </div>
</div>

<script src="/src/auth-frontend.js"></script>
<script>
    const HEADERS = { Authorization: `Bearer ${localStorage.getItem('admin_token')}` };
    let currentPage = 1;

    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function loadUsers(page = 1) {
        currentPage = page;
        const q = document.getElementById('search-input').value.trim();
        const url = `/api/admin/users?page=${page}` + (q ? `&q=${encodeURIComponent(q)}` : '');
        const tbody = document.getElementById('users-tbody');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i>로딩 중...</td></tr>';
        try {
            const res  = await fetch(url, { headers: HEADERS });
            const data = await res.json();
            if (data.error) { tbody.innerHTML = `<tr><td colspan="5" class="text-center p-8 text-red-400">${escHtml(data.error)}</td></tr>`; return; }
            const users = data.users || [];
            if (!users.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center p-8 text-gray-500">사용자 없음</td></tr>'; return; }
            const planBadge = { free:'bg-gray-800 text-gray-300', starter:'bg-blue-900/40 text-blue-300', pro:'bg-orange-900/40 text-orange-300' };
            tbody.innerHTML = users.map(u => `
                <tr class="border-b border-white/5 hover:bg-white/3 transition">
                    <td class="p-4 font-mono text-xs">${escHtml(u.email)}</td>
                    <td class="p-4"><span class="text-xs ${u.role==='admin'?'text-red-400':'text-gray-400'}">${u.role}</span></td>
                    <td class="p-4"><span class="text-xs px-2 py-1 rounded-full ${planBadge[u.plan]||'bg-gray-800 text-gray-300'}">${u.plan}</span></td>
                    <td class="p-4 text-gray-500 text-xs">${new Date(u.created_at).toLocaleDateString('ko-KR')}</td>
                    <td class="p-4 flex gap-2">
                        <button onclick="openModal('${escHtml(u.id)}','${escHtml(u.plan)}','${escHtml(u.role)}')" class="text-xs border border-white/20 px-3 py-1 rounded-lg hover:bg-white/5 transition">수정</button>
                        <button onclick="deleteUser('${escHtml(u.id)}','${escHtml(u.email)}')" class="text-xs border border-red-500/30 text-red-400 px-3 py-1 rounded-lg hover:bg-red-900/20 transition">삭제</button>
                    </td>
                </tr>`).join('');

            // 페이지네이션
            const total = data.total || 0;
            const pages = Math.ceil(total / (data.limit || 50));
            document.getElementById('pagination').innerHTML = pages > 1
                ? Array.from({length: Math.min(pages,10)}, (_,i) => i+1).map(p =>
                    `<button onclick="loadUsers(${p})" class="px-3 py-1 rounded-lg text-sm ${p===currentPage?'bg-blue-700':'bg-white/5 hover:bg-white/10'} transition">${p}</button>`
                  ).join('')
                : '';
        } catch(e) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center p-8 text-red-400">오류: ${e.message}</td></tr>`;
        }
    }

    function openModal(id, plan, role) {
        document.getElementById('edit-uid').value  = id;
        document.getElementById('edit-plan').value = plan;
        document.getElementById('edit-role').value = role;
        document.getElementById('edit-modal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('edit-modal').classList.add('hidden'); }

    async function saveUser() {
        const id   = document.getElementById('edit-uid').value;
        const plan = document.getElementById('edit-plan').value;
        const role = document.getElementById('edit-role').value;
        const res  = await fetch(`/api/admin/users?id=${id}`, {
            method: 'PUT', headers: { ...HEADERS, 'Content-Type': 'application/json' },
            body: JSON.stringify({ plan, role }),
        });
        const data = await res.json();
        alert(data.message || data.error);
        closeModal();
        loadUsers(currentPage);
    }

    async function deleteUser(id, email) {
        if (!confirm(`'${email}' 사용자와 관련 데이터를 모두 삭제하시겠습니까?`)) return;
        const res  = await fetch(`/api/admin/users?id=${id}`, { method: 'DELETE', headers: HEADERS });
        const data = await res.json();
        alert(data.message || data.error);
        loadUsers(currentPage);
    }

    loadUsers();
</script>
</body>
</html>
