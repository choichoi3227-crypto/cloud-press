name = "cloud-press-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
INFERENCE_SERVER_URL = "https://cloudpress-inference-edge.jiji15899.workers.dev/"
# WordPress cloud-press-deploy 플러그인이 조회할 수 있는 저장소 화이트리스트.
# owner/repo 형식, 쉼표로 구분. 실제 배포 승인은 WordPress 쪽 다중 승인 로직이 담당하며
# 이건 그 앞단의 2차 방어선일 뿐이다 (docs/12-github-deploy-plugin-spec.md 참조).
DEPLOY_REPO_WHITELIST = "choichoi3227-crypto/cloud-press"

# 아래는 `wrangler d1 create` / `wrangler kv namespace create` 실행 후
# 출력되는 실제 id로 반드시 교체해야 합니다. (07-deployment-guide.md 참조)

[[d1_databases]]
binding = "DB"
database_name = "cloud-press-db"
database_id = "ece00019-1599-41f9-8fa7-208244098665"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "8b6150983ee44749ba939f93e9602f45"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "9b1dfc61087e44da877e6b49e5083237"

# secrets (파일에 값 쓰지 말 것 — 아래 명령으로 각각 설정)
# npx wrangler secret put INTERNAL_API_KEY    (Worker <-> 추론 서버)
# npx wrangler secret put ADMIN_SECRET        (WordPress connector <-> Worker, 사용자 API 키 발급용)
# npx wrangler secret put DEPLOY_PROXY_KEY    (WordPress deploy 플러그인 <-> Worker, GitHub 프록시용)
# npx wrangler secret put GITHUB_TOKEN        (Worker -> GitHub API 조회용, repo 읽기 권한만 부여)

# (선택) Cloudflare 위 추론 서버(workers/inference-edge)를 서비스 바인딩으로 연결.
# inference-edge를 먼저 배포한 뒤에만 주석을 해제하세요 (없는 Worker를 바인딩하면 deploy가 실패합니다).
# 바인딩이 있으면 INFERENCE_SERVER_URL보다 우선합니다.
[[services]]
binding = "INFERENCE_EDGE"
service = "cloud-press-inference-edge"
