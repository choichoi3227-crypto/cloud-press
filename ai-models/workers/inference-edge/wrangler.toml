name = "cloud-press-inference-edge"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# 이 Worker는 추론 서버(FastAPI)와 같은 API 계약(/v1/health, /v1/image/generate, /v1/text/generate)을
# Cloudflare 위에서 제공합니다. api-gateway의 INFERENCE_SERVER_URL에 이 Worker의 주소를 넣으면 됩니다.
# 무료 플랜: 조건 이미지=뱅크(CPU≈0), 자유 문장 이미지·텍스트=Workers AI(일 10,000 Neurons).

# Workers AI 바인딩 — Cloudflare 호스팅 실제 생성 AI(이미지 FLUX.1 schnell, 텍스트 Llama 등).
# 무료 플랜: 하루 10,000 Neurons(모든 모델 합산). 이 줄을 지우면 이미지(조건)만 뱅크로 동작합니다.
[ai]
binding = "AI"

[vars]
# Workers AI 모델 ID (카탈로그가 바뀌면 여기서 교체: https://developers.cloudflare.com/workers-ai/models/ )
IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
# 텍스트: 아래 TEXT_MODEL을 지정하면 "고정 모델"(프로필 무시). 지운 채로 두면 LoRA 프로필(quality/general/fast)을 씁니다.
# LoRA 어댑터를 올리기 전에는 자동으로 기반 모델만 호출됩니다(응답 lora=null). 어댑터 이름은 src/ai.ts DEFAULT_TEXT_PROFILES 참고.
TEXT_PROFILE_DEFAULT = "quality"
# TEXT_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
# "0"이면 Workers AI를 사용하지 않음
ENABLE_AI = "1"
# "1"이면 뱅크가 비었을 때 Worker에서 cGAN을 실시간 생성합니다(CPU 약 0.2초 → 유료 플랜 전용, 무료 플랜 금지).
EDGE_LIVE = "0"

# api-gateway와 같은 CACHE_KV를 공유합니다 (뱅크는 한 번만 올리면 둘 다 사용).
[[kv_namespaces]]
binding = "CACHE_KV"
id = "39c4bf548f954ffabc6f9f5cdb449fd5"

# secrets (파일에 값 쓰지 말 것):
# npx wrangler secret put INTERNAL_API_KEY    (api-gateway의 INTERNAL_API_KEY와 같은 값)
