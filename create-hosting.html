<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>호스팅 생성 - Cloud Press</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-10">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">새 워드프레스 호스팅 생성</h1>
        <div class="space-y-6 bg-[#111] p-8 rounded-2xl border border-white/10">
            <div>
                <label class="block text-sm text-gray-400 mb-2">사이트 이름</label>
                <input id="site_name" type="text" class="w-full bg-black border border-white/20 rounded-lg p-3">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">도메인 연결</label>
                <input id="primary_domain" type="text" placeholder="example.com" class="w-full bg-black border border-white/20 rounded-lg p-3">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">PHP 버전 선택 (무중단 적용)</label>
                <select id="php_version" class="w-full bg-black border border-white/20 rounded-lg p-3">
                    <option value="8.3">PHP 8.3 (Latest)</option>
                    <option value="8.2" selected>PHP 8.2 (Stable)</option>
                    <option value="8.1">PHP 8.1</option>
                    <option value="7.4">PHP 7.4 (Legacy)</option>
                </select>
                <p class="text-xs text-gray-500 mt-2">* 적용 시 공식 홈페이지에서 바이너리를 실시간으로 로드하여 무중단 배포합니다.</p>
            </div>
            <button onclick="submitHosting()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-4 rounded-xl transition">호스팅 생성하기</button>
        </div>
    </div>
    <script>
        async function submitHosting() {
            const body = {
                site_name: document.getElementById('site_name').value,
                primary_domain: document.getElementById('primary_domain').value,
                php_version: document.getElementById('php_version').value
            };
            const res = await fetch('/api/sites', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                alert('호스팅이 성공적으로 생성되었습니다!');
                location.href = '/admin.html';
            }
        }
    </script>
</body>
</html>
