<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도메인 관리 | CloudPress</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .domain-card:hover { border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
        .domain-card { transition: all 0.2s ease; }
        .status-active   { background:#16a34a22; border-color:#16a34a55; color:#4ade80; }
        .status-pending  { background:#ca8a0422; border-color:#f59e0b55; color:#fbbf24; }
        .status-error    { background:#dc262622; border-color:#ef444455; color:#f87171; }
        .ns-box { font-family: 'Courier New', monospace; background:#0a0a0a; border:1px solid rgba(255,255,255,0.08); }
    </style>
</head>
<body class="bg-[#050505] text-white md:flex md:h-screen">
    <script>
        const token = localStorage.getItem('admin_token');
        if (!token) window.location.href = '/login';
    </script>

    <!-- Main -->
    <main class="flex-1 w-full overflow-y-auto">
        <div class="p-8 max-w-5xl mx-auto">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-3xl font-bold">도메인 관리</h1>
                    <p class="text-gray-500 text-sm mt-1">호스팅에 연결된 도메인을 관리합니다</p>
                </div>
                <button onclick="openAddModal()" class="bg-blue-600 px-5 py-2.5 rounded-xl text-white font-bold hover:bg-blue-500 transition flex items-center gap-2 text-sm">
                    <i class="fas fa-plus"></i> 도메인 추가
                </button>
            </header>

            <div id="alertMsg" class="hidden mb-6 p-3 rounded-xl text-sm text-center"></div>

            <!-- 도메인 목록 -->
            <div id="domain-list">
                <div class="text-center py-16 text-gray-600">
                    <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                    <p>로딩 중...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 도메인 추가 모달 -->
    <div id="addModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-[#111] border border-white/10 rounded-2xl p-8 w-full max-w-lg mx-4 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold">도메인 추가</h2>
                <button onclick="closeAddModal()" class="text-gray-500 hover:text-white transition text-xl">&times;</button>
            </div>

            <div class="mb-4">
                <label class="text-sm text-gray-400 mb-2 block">연결할 호스팅 선택</label>
                <select id="modal-site-select" class="w-full p-3 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 transition text-sm">
                    <option value="">호스팅 선택...</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="text-sm text-gray-400 mb-2 block">도메인 주소</label>
                <input id="modal-domain-input" type="text" placeholder="example.com 또는 www.example.com"
                    class="w-full p-3 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 transition text-sm">
                <p class="text-xs text-gray-600 mt-2">
                    <i class="fas fa-info-circle mr-1"></i>
                    이미 Cloudflare 네임서버를 사용 중이면 자동으로 감지하여 즉시 연결됩니다
                </p>
            </div>

            <div id="modal-result" class="hidden mb-4 p-4 rounded-xl text-sm border"></div>

            <div class="flex gap-3">
                <button onclick="closeAddModal()" class="flex-1 border border-white/20 py-3 rounded-xl font-bold hover:bg-white/5 transition text-sm">취소</button>
                <button onclick="addDomain()" id="addBtn" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-500 transition text-sm">
                    <i class="fas fa-plus mr-2"></i> 추가
                </button>
            </div>
        </div>
    </div>

    <!-- NS 안내 모달 -->
    <div id="nsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
        <div class="bg-[#111] border border-white/10 rounded-2xl p-8 w-full max-w-lg mx-4 shadow-2xl">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold">네임서버 설정 안내</h2>
                <button onclick="closeNsModal()" class="text-gray-500 hover:text-white transition text-xl">&times;</button>
            </div>
            <div id="ns-content"></div>
            <button onclick="closeNsModal()" class="w-full mt-6 bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-500 transition text-sm">확인</button>
        </div>
    </div>

    <script src="/src/auth-frontend.js"></script>
    <script src="/src/sidebar.js"></script>
    <script>
        const TOKEN = localStorage.getItem('admin_token');
        const H = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
        let allSites = [];
        let allDomains = [];

        function showAlert(msg, type = 'error') {
            const el = document.getElementById('alertMsg');
            el.className = `mb-6 p-3 rounded-xl text-sm text-center ${type === 'error' ? 'bg-red-900/30 text-red-400 border border-red-500/30' : 'bg-green-900/30 text-green-400 border border-green-500/30'}`;
            el.textContent = msg;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        function statusBadge(status) {
            const map = {
                active:  { cls: 'status-active',  icon: 'fa-check-circle', label: '활성' },
                pending: { cls: 'status-pending', icon: 'fa-clock',        label: '대기 중' },
                error:   { cls: 'status-error',   icon: 'fa-times-circle', label: '오류' },
            };
            const s = map[status] || map.pending;
            return `<span class="text-xs px-3 py-1 rounded-full border font-bold ${s.cls}">
                <i class="fas ${s.icon} mr-1 text-[10px]"></i>${s.label}
            </span>`;
        }

        function renderDomains() {
            const el = document.getElementById('domain-list');
            if (!allDomains.length) {
                el.innerHTML = `
                <div class="text-center py-24 text-gray-500">
                    <div class="text-6xl mb-6 opacity-20"><i class="fas fa-globe"></i></div>
                    <p class="text-xl font-bold mb-2">등록된 도메인이 없습니다</p>
                    <p class="text-sm mb-6">호스팅에 커스텀 도메인을 연결하세요</p>
                    <button onclick="openAddModal()" class="bg-blue-600 px-6 py-3 rounded-full font-bold hover:bg-blue-500 transition">
                        <i class="fas fa-plus mr-2"></i> 도메인 추가하기
                    </button>
                </div>`;
                return;
            }

            // 사이트별 그룹화
            const grouped = {};
            allDomains.forEach(d => {
                const siteName = allSites.find(s => s.id === d.site_id)?.site_name || `사이트 #${d.site_id}`;
                if (!grouped[d.site_id]) grouped[d.site_id] = { siteName, domains: [] };
                grouped[d.site_id].domains.push(d);
            });

            el.innerHTML = Object.entries(grouped).map(([siteId, group]) => `
            <div class="mb-8">
                <div class="flex items-center gap-2 mb-3">
                    <i class="fas fa-server text-xs text-gray-600"></i>
                    <span class="text-sm font-semibold text-gray-400">${escHtml(group.siteName)}</span>
                    <a href="/hosting-detail?id=${siteId}" class="text-xs text-blue-400 hover:underline ml-1">호스팅 관리 →</a>
                </div>
                <div class="space-y-3">
                    ${group.domains.map(d => `
                    <div class="domain-card bg-[#0f0f0f] border border-white/10 rounded-2xl p-5">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center">
                                    <i class="fas fa-globe text-gray-500 text-sm"></i>
                                </div>
                                <div>
                                    <div class="font-semibold flex items-center gap-2">
                                        ${escHtml(d.domain)}
                                        ${d.is_primary ? '<span class="text-xs bg-blue-900/40 border border-blue-500/30 text-blue-300 px-2 py-0.5 rounded-lg">기본</span>' : ''}
                                    </div>
                                    <div class="text-xs text-gray-600 mt-0.5">
                                        ${d.cf_zone_id ? `Zone: ${d.cf_zone_id.substring(0,8)}...` : 'Zone 없음'}
                                    </div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                ${statusBadge(d.cf_ssl_status || 'pending')}
                                <button onclick="openDns('${escHtml(d.domain)}', '${siteId}')" class="text-xs border border-white/10 px-3 py-1.5 rounded-lg hover:bg-white/5 transition text-gray-400 hover:text-white">
                                    <i class="fas fa-dns mr-1"></i> DNS 관리
                                </button>
                                ${d.cf_ssl_status !== 'active' ? `
                                <button onclick="verifyDomain('${siteId}', '${escHtml(d.domain)}')" class="text-xs bg-yellow-600/20 border border-yellow-500/30 text-yellow-400 px-3 py-1.5 rounded-lg hover:bg-yellow-600/30 transition">
                                    <i class="fas fa-sync mr-1"></i> 확인
                                </button>` : ''}
                                <button onclick="deleteDomain(${d.id})" class="text-xs text-gray-600 hover:text-red-400 transition px-1">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        ${d.cf_ssl_status !== 'active' && d.cf_nameservers ? `
                        <div class="mt-4 p-3 ns-box rounded-xl text-xs">
                            <div class="text-gray-500 mb-2 font-sans">⚠️ 아래 네임서버로 변경해주세요:</div>
                            ${d.cf_nameservers.split(',').map(ns => `<div class="text-green-400 py-0.5">${ns}</div>`).join('')}
                        </div>` : ''}
                    </div>`).join('')}
                </div>
            </div>`).join('');
        }

        async function loadAll() {
            try {
                const [sitesRes, _] = await Promise.all([
                    fetch('/api/sites', { headers: H }),
                ]);
                const sitesData = await sitesRes.json();
                allSites = sitesData.sites || [];

                // 각 사이트의 도메인 로드
                const domainPromises = allSites.map(s =>
                    fetch(`/api/domains?site_id=${s.id}`, { headers: H })
                        .then(r => r.json())
                        .then(d => (d.domains || []))
                        .catch(() => [])
                );
                const results = await Promise.all(domainPromises);
                allDomains = results.flat();
                renderDomains();
            } catch (e) {
                document.getElementById('domain-list').innerHTML = `<div class="text-center py-16 text-red-400"><i class="fas fa-exclamation-circle text-3xl mb-3"></i><p>로드 실패</p></div>`;
            }
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            const sel = document.getElementById('modal-site-select');
            sel.innerHTML = '<option value="">호스팅 선택...</option>' +
                allSites.map(s => `<option value="${s.id}">${escHtml(s.site_name)} (${escHtml(s.primary_domain)})</option>`).join('');
            document.getElementById('modal-domain-input').value = '';
            document.getElementById('modal-result').classList.add('hidden');
        }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }
        function closeNsModal() { document.getElementById('nsModal').classList.add('hidden'); }

        function openDns(domain, siteId) {
            window.location.href = `/dns?domain=${encodeURIComponent(domain)}&site_id=${siteId}`;
        }

        async function addDomain() {
            const siteId = document.getElementById('modal-site-select').value;
            const domain = document.getElementById('modal-domain-input').value.trim();
            if (!siteId) return alert('호스팅을 선택해주세요.');
            if (!domain) return alert('도메인을 입력해주세요.');

            const btn = document.getElementById('addBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> 처리 중...';

            try {
                const res = await fetch('/api/domains', {
                    method: 'POST', headers: H,
                    body: JSON.stringify({ site_id: siteId, domain })
                });
                const data = await res.json();

                const resultEl = document.getElementById('modal-result');
                if (res.ok && data.success) {
                    resultEl.className = 'mb-4 p-4 rounded-xl text-sm border bg-green-900/20 border-green-500/30 text-green-400';
                    resultEl.innerHTML = `<div class="font-semibold mb-2">✅ ${data.message}</div>` +
                        (data.nameservers?.length ? `<div class="mt-2 space-y-1">${data.nameservers.map(ns => `<div class="font-mono text-xs bg-black/30 px-2 py-1 rounded">${ns}</div>`).join('')}</div>` : '');
                    resultEl.classList.remove('hidden');
                    await loadAll();
                } else {
                    resultEl.className = 'mb-4 p-4 rounded-xl text-sm border bg-red-900/20 border-red-500/30 text-red-400';
                    resultEl.textContent = data.error || '도메인 추가에 실패했습니다.';
                    resultEl.classList.remove('hidden');
                }
            } catch {
                alert('오류가 발생했습니다.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-plus mr-2"></i> 추가';
            }
        }

        async function verifyDomain(siteId, domain) {
            try {
                const res = await fetch(`/api/domains?site_id=${siteId}&domain=${encodeURIComponent(domain)}&verify=1`, { headers: H });
                const data = await res.json();
                if (data.verified) {
                    showAlert('✅ ' + data.message, 'success');
                    await loadAll();
                } else {
                    showAlert('⏳ ' + data.message, 'error');
                }
            } catch { showAlert('확인 중 오류가 발생했습니다.'); }
        }

        async function deleteDomain(id) {
            if (!confirm('이 도메인을 삭제하시겠습니까?')) return;
            try {
                const res = await fetch(`/api/domains?id=${id}`, { method: 'DELETE', headers: H });
                const data = await res.json();
                if (res.ok) { showAlert('도메인이 삭제되었습니다.', 'success'); await loadAll(); }
                else showAlert(data.error || '삭제 실패');
            } catch { showAlert('오류가 발생했습니다.'); }
        }

        function escHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        loadAll();
    </script>
</body>
</html>
