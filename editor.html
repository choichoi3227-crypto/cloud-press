<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudPress Code Editor</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Prism.js for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-php.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
</head>
<body class="editor-mode">
    <header class="editor-header">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold" id="current-filename">loading...</h1>
            <span class="px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-xs font-semibold">PHP 8.2</span>
        </div>
        <div class="flex gap-3">
            <button class="btn-secondary" onclick="toggleHistory()"><i class="fas fa-history"></i> 버전 기록</button>
            <button class="btn-primary" onclick="saveFile()"><i class="fas fa-save"></i> 저장 및 배포</button>
        </div>
    </header>

    <div class="editor-layout">
        <div class="code-panel">
            <textarea id="code-editor" spellcheck="false" oninput="updateHighlighting()"></textarea>
            <pre id="highlighting-area" aria-hidden="true"><code class="language-php" id="highlighting-content"></code></pre>
        </div>
        <div class="diagnostics-panel">
            <h2 class="text-lg font-bold mb-3">AI 진단 및 해결책</h2>
            <div id="ai-diagnostics-output" class="text-sm text-gray-400">
                <p>파일을 로드하면 AI가 PHP 호환성 문제를 분석합니다.</p>
            </div>
        </div>
    </div>

    <div id="history-sidebar" class="history-sidebar">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold">버전 기록</h3>
            <button class="text-gray-400 hover:text-white" onclick="toggleHistory()"><i class="fas fa-times"></i></button>
        </div>
        <div id="snapshot-list" class="space-y-3">
            <!-- 스냅샷 목록이 여기에 로드됩니다 -->
        </div>
    </div>

    <script>
        // 에디터 프론트엔드 로직
        let currentFilePath = '';
        let currentFileContent = '';

        const params     = new URLSearchParams(window.location.search);
        const SITE_ID    = params.get('site_id') || '';
        const TOKEN      = localStorage.getItem('token') || localStorage.getItem('admin_token') || '';
        const HEADERS    = () => ({ 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` });

        if (!TOKEN) window.location.href = '/login';

        async function loadFile(path) {
            currentFilePath = path;
            document.getElementById('current-filename').innerText = path.split('/').pop();
            const res  = await fetch(`/api/editor/read?path=${encodeURIComponent(path)}&site_id=${SITE_ID}`, { headers: HEADERS() });
            const data = await res.json();
            if (!data.success) {
                document.getElementById('ai-diagnostics-output').innerHTML =
                    `<p class="text-red-400">파일 로드 실패: ${data.error || '알 수 없는 오류'}</p>`;
                return;
            }
            currentFileContent = data.content;
            document.getElementById('code-editor').value = currentFileContent;
            updateHighlighting();
            analyzeCode(currentFileContent); // AI 진단 실행
        }

        async function saveFile() {
            const newContent = document.getElementById('code-editor').value;
            const res = await fetch('/api/editor/save', {
                method: 'POST',
                headers: HEADERS(),
                body: JSON.stringify({ path: currentFilePath, content: newContent, site_id: SITE_ID })
            });
            const data = await res.json();
            if (data.success) {
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-6 right-6 bg-green-600 text-white px-6 py-3 rounded-2xl font-bold shadow-xl z-50 transition';
                toast.textContent = '✓ 파일이 저장되고 배포되었습니다!';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
                currentFileContent = newContent;
            } else {
                alert('파일 저장 실패: ' + (data.error || '알 수 없는 오류'));
            }
        }

        function updateHighlighting() {
            const code    = document.getElementById('code-editor').value;
            const content = document.getElementById('highlighting-content');
            content.textContent = code;
            Prism.highlightElement(content);
        }

        async function analyzeCode(code) {
            const output = document.getElementById('ai-diagnostics-output');
            output.innerHTML = '<p class="text-gray-500 animate-pulse">분석 중...</p>';
            const res  = await fetch('/api/editor/analyze-php', {
                method: 'POST',
                headers: HEADERS(),
                body: JSON.stringify({ code })
            });
            const data = await res.json();
            if (data.detected) {
                output.innerHTML = `
                    <p class="text-red-400 font-bold mb-2">문제 감지됨</p>
                    <pre class="text-xs text-gray-300 whitespace-pre-wrap mb-3">${data.diagnosis}</pre>
                    <p class="text-blue-400 font-bold mb-1">해결책</p>
                    <p class="text-sm text-gray-300">${data.solution}</p>`;
            } else {
                output.innerHTML = `<p class="text-green-400">✓ PHP 8.x 호환성 문제가 발견되지 않았습니다.</p>`;
            }
        }

        async function toggleHistory() {
            const sidebar = document.getElementById('history-sidebar');
            sidebar.classList.toggle('hidden');
            if (!sidebar.classList.contains('hidden')) {
                const res       = await fetch(`/api/editor/snapshots?path=${encodeURIComponent(currentFilePath)}&site_id=${SITE_ID}`, { headers: HEADERS() });
                const data      = await res.json();
                const snapshots = data.snapshots || [];
                const list      = document.getElementById('snapshot-list');
                list.innerHTML  = snapshots.length
                    ? snapshots.map(s => `
                        <div class="snapshot-item cursor-pointer bg-white/5 hover:bg-white/10 rounded-xl p-3 transition" onclick="rollback(${s.id})">
                            <span class="font-bold text-sm">${new Date(s.created_at).toLocaleString('ko-KR')}</span>
                            <span class="text-gray-500 text-xs block">클릭하여 복원</span>
                        </div>
                    `).join('')
                    : '<p class="text-gray-500 text-sm">저장된 스냅샷이 없습니다.</p>';
            }
        }

        async function rollback(snapshotId) {
            if (!confirm('이 버전으로 되돌리시겠습니까? 현재 수정 사항은 덮어씌워집니다.')) return;
            const res  = await fetch(`/api/editor/rollback`, {
                method: 'POST',
                headers: HEADERS(),
                body: JSON.stringify({ snapshotId, site_id: SITE_ID })
            });
            const data = await res.json();
            if (data.success) {
                currentFileContent = data.content;
                document.getElementById('code-editor').value = currentFileContent;
                updateHighlighting();
                alert('파일이 이전 버전으로 복원되었습니다!');
                toggleHistory(); // 사이드바 닫기
            } else {
                alert('복원 실패: ' + (data.error || '알 수 없는 오류'));
            }
        }

        // 초기 로드
        const initialPath = params.get('path') || 'wp-content/themes/mytheme/functions.php';
        loadFile(initialPath);
    </script>
</body>
</html>
