<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호스팅 관리 | CloudPress</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .status-active   { background:#16a34a22; border-color:#16a34a55; color:#4ade80; }
        .status-creating { background:#1d4ed822; border-color:#3b82f655; color:#60a5fa; }
        .status-suspended{ background:#dc262622; border-color:#ef444455; color:#f87171; }
        .site-card:hover  { border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .site-card { transition: all 0.2s ease; }
    select, select, select option { background: #111827; color: #e5e7eb; } select { color-scheme: dark; } select { color-scheme: dark; }
        </style>
</head>
<body class="cp-console bg-[#050505] text-white md:flex md:h-screen">
    <script>
        if (!localStorage.getItem('admin_token')) window.location.href = '/login';
    </script>

    <!-- Main -->
    <main class="flex-1 w-full overflow-y-auto">
        <div class="p-6 md:p-8 max-w-6xl mx-auto">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold">호스팅 관리</h1>
                    <p id="site-count" class="text-gray-500 text-sm mt-1">로딩 중...</p>
                </div>
                <a href="/hosting-create"
                    class="bg-blue-600 px-4 md:px-6 py-2.5 md:py-3 rounded-full text-white font-bold hover:bg-blue-500 transition flex items-center gap-2 text-sm md:text-base">
                    <i class="fas fa-plus"></i>
                    <span class="hidden sm:inline">새 호스팅 생성</span>
                    <span class="sm:hidden">생성</span>
                </a>
            </header>

            <!-- 필터/검색 -->
            <div class="flex gap-3 mb-6">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input id="search-input" type="text" placeholder="사이트 이름 또는 도메인 검색..."
                        class="w-full pl-10 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 transition text-sm"
                        oninput="filterSites()">
                </div>
                <select id="status-filter" onchange="filterSites()"
                    class="px-3 py-3 bg-white/5 border border-white/10 rounded-xl outline-none focus:border-blue-500 transition text-sm">
                    <option value="">전체</option>
                    <option value="active">운영 중</option>
                    <option value="suspended">중단됨</option>
                    <option value="creating">생성 중</option>
                </select>
            </div>

            <!-- 호스팅 목록 -->
            <div id="hosting-list">
                <div class="text-center py-20 text-gray-500">
                    <i class="fas fa-spinner fa-spin text-3xl mb-4 block"></i>
                    <p>호스팅 목록을 불러오는 중...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/src/auth-frontend.js"></script>
    <script src="/src/sidebar.js"></script>
     <script src="/src/public-nav.js"></script>
    <script>
        const TOKEN   = localStorage.getItem('admin_token');
        const HEADERS = { 'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json' };
        let allSites  = [];

        function statusBadge(status) {
            const map = {
                active:    { cls: 'status-active',    icon: 'fa-circle',    label: '운영 중' },
                creating:  { cls: 'status-creating',  icon: 'fa-spinner fa-spin', label: '생성 중' },
                suspended: { cls: 'status-suspended', icon: 'fa-pause',     label: '중단됨'  },
            };
            const s = map[status] || { cls: 'status-creating', icon: 'fa-question', label: status };
            return `<span class="text-xs px-3 py-1 rounded-full border font-bold ${s.cls}">
                        <i class="fas ${s.icon} mr-1 text-[10px]"></i>${s.label}
                    </span>`;
        }

        function phpBadge(version) {
            return `<span class="text-xs bg-indigo-900/40 border border-indigo-500/30 text-indigo-300 px-2 py-1 rounded-lg font-mono">PHP ${version}</span>`;
        }

        function renderSites(sites) {
            const el = document.getElementById('hosting-list');
            if (!sites || sites.length === 0) {
                el.innerHTML = `
                    <div class="text-center py-24 text-gray-500">
                        <div class="text-6xl mb-6 opacity-20"><i class="fas fa-server"></i></div>
                        <p class="text-xl font-bold mb-2">호스팅이 없습니다</p>
                        <p class="text-sm mb-6">새 호스팅을 생성하여 워드프레스를 시작하세요!</p>
                        <a href="/hosting-create" class="bg-blue-600 px-6 py-3 rounded-full font-bold hover:bg-blue-500 transition inline-block">
                            <i class="fas fa-plus mr-2"></i> 호스팅 생성하기
                        </a>
                    </div>`;
                return;
            }

            el.innerHTML = `<div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                ${sites.map(site => `
                    <div class="site-card bg-[#0f0f0f] border border-white/10 rounded-2xl p-6 cursor-pointer"
                         onclick="window.location='/hosting-detail?id=${site.id}'">
                        <div class="flex justify-between items-start mb-4">
                            <div class="min-w-0 flex-1 pr-3">
                                <h3 class="text-lg font-bold truncate">${escHtml(site.site_name)}</h3>
                                <a href="https://${escHtml(site.primary_domain)}" target="_blank"
                                   onclick="event.stopPropagation()"
                                   class="text-blue-400 text-sm hover:underline flex items-center gap-1 mt-1">
                                    <i class="fas fa-external-link-alt text-xs"></i>
                                    <span class="truncate">${escHtml(site.primary_domain)}</span>
                                </a>
                            </div>
                            <div class="flex flex-col items-end gap-2 flex-shrink-0">
                                ${statusBadge(site.status)}
                                ${phpBadge(site.php_version || '8.2')}
                            </div>
                        </div>

                        <div class="flex items-center justify-between text-xs text-gray-600 pt-4 border-t border-white/5">
                            <span><i class="fas fa-calendar mr-1"></i>
                                ${site.created_at ? new Date(site.created_at).toLocaleDateString('ko-KR') : '-'}
                            </span>
                            <div class="flex gap-3 items-center">
                                ${site.cache_enabled
                                    ? '<span class="text-green-500"><i class="fas fa-bolt mr-1"></i>캐시 ON</span>'
                                    : '<span class="text-gray-600"><i class="fas fa-bolt mr-1"></i>캐시 OFF</span>'}
                                <button onclick="deleteSite('${site.id}', event)" class="text-gray-500 hover:text-red-400 transition p-1">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>`;
        }

        function filterSites() {
            const q      = document.getElementById('search-input').value.toLowerCase();
            const status = document.getElementById('status-filter').value;
            const filtered = allSites.filter(s => {
                const matchQ = !q || s.site_name.toLowerCase().includes(q) || s.primary_domain.toLowerCase().includes(q);
                const matchS = !status || s.status === status;
                return matchQ && matchS;
            });
            renderSites(filtered);
            document.getElementById('site-count').textContent =
                `${filtered.length}개 표시 중 (전체 ${allSites.length}개)`;
        }

        async function loadHostings() {
            try {
                const res  = await fetch('/api/sites', { headers: HEADERS });
                if (res.status === 401) {
                    localStorage.removeItem('admin_token');
                    window.location.href = '/login';
                    return;
                }
                const data = await res.json();
                allSites   = data.sites || [];
                document.getElementById('site-count').textContent = `전체 ${allSites.length}개`;
                renderSites(allSites);
            } catch (e) {
                console.error('[hosting] 로드 실패:', e);
                document.getElementById('hosting-list').innerHTML =
                    `<div class="text-center py-16 text-red-400">
                        <i class="fas fa-exclamation-circle text-3xl mb-3 block"></i>
                        <p>호스팅 목록을 불러오지 못했습니다.</p>
                    </div>`;
            }
        }

        async function deleteSite(id, event) {
            event.stopPropagation();
            if (!confirm('정말 이 호스팅을 삭제하시겠습니까? 모든 데이터가 삭제됩니다.')) return;
            try {
                const res = await fetch(`/api/sites?id=${id}`, { method: 'DELETE', headers: HEADERS });
                const d   = await res.json();
                if (res.ok) {
                    allSites = allSites.filter(s => s.id !== id);
                    filterSites();
                } else {
                    alert(d.error || '삭제에 실패했습니다.');
                }
            } catch {
                alert('오류가 발생했습니다.');
            }
        }

        function escHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        loadHostings();
    </script>
</body>
</html>
