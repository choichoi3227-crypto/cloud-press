<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 호스팅 | CloudPress</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen bg-black text-white">
    <!-- 사이드바 동일 -->
    <main class="flex-1 p-10">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-bold">내 호스팅</h1>
            <button onclick="launchNewHosting()" class="bg-blue-600 px-6 py-2 rounded-full font-bold">새 호스팅 생성</button>
        </div>
        
        <div id="hosting-list" class="space-y-4">
            <!-- 더미 데이터 제거됨. 실제 데이터가 이곳에 렌더링됩니다. -->
            <div class="text-center py-20 text-gray-500">
                <p>현재 운영 중인 호스팅이 없습니다.</p>
            </div>
        </div>
    </main>
</body>
</html>
