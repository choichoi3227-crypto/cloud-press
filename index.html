<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>클라우드프레스
    차세세 워드프레스 호스팅</title>
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white font-sans">
    <header class="p-6 border-b border-white/10 sticky top-0 bg-[#050505]/80 backdrop-blur-md z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-black tracking-tighter text-blue-500">CLOUD<span class="text-white">PRESS</span></a>
            <nav class="hidden md:flex gap-8 items-center text-sm font-medium text-gray-400">
                <a href="#features" class="hover:text-white transition">기능</a>
                <a href="#faq" class="hover:text-white transition">FAQ</a>
                <a href="login.html" class="hover:text-white transition">로그인</a>
                <a href="signup.html" class="bg-blue-600 px-5 py-2 rounded-full text-white font-bold hover:bg-blue-500 transition">무료 시작</a>
            </nav>
        </div>
    </header>

    <section class="py-32 px-6 text-center">
        <h1 class="text-5xl md:text-7xl font-black mb-8 leading-tight">Serverless 기반<br><span class="text-blue-600">초고속 워드프레스</span></h1>
        <p class="max-w-2xl mx-auto text-gray-400 text-lg mb-12">전 세계 300개 엣지 노드에서 구동되는 차세대 호스팅. VPS의 성능 한계를 뛰어넘으세요.</p>
        <div class="flex justify-center gap-4">
            <a href="signup.html" class="bg-white text-black px-8 py-4 rounded-full font-black hover:bg-gray-200 transition">지금 배포하기</a>
        </div>
    </section>

    <section id="faq" class="py-24 max-w-3xl mx-auto px-6">
        <h2 class="text-3xl font-bold mb-12 text-center">자주 묻는 질문</h2>
        <div class="space-y-4">
            <div class="faq-item border border-white/10 rounded-2xl overflow-hidden">
                <button class="w-full p-6 text-left flex justify-between items-center bg-white/5 hover:bg-white/10 transition">
                    <span class="font-bold">기존 호스팅과 무엇이 다른가요?</span>
                    <i class="fas fa-plus text-xs text-gray-500"></i>
                </button>
                <div class="faq-content hidden p-6 text-gray-400 text-sm border-t border-white/5">
                    CloudPress는 서버가 아닌 Cloudflare의 엣지 네트워크에서 PHP WASM 런타임을 통해 워드프레스를 실행합니다. 전 세계 어디서든 동일한 속도를 보장합니다.
                </div>
            </div>
        </div>
    </section>

    <script>
        document.querySelectorAll('.faq-item button').forEach(btn => {
            btn.addEventListener('click', () => {
                const content = btn.nextElementSibling;
                const icon = btn.querySelector('i');
                content.classList.toggle('hidden');
                icon.classList.toggle('fa-plus');
                icon.classList.toggle('fa-minus');
            });
        });
    </script>
</body>
</html>
