<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CacheCloud | CloudPress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>body{background:#050505;color:#fff}.plan-popular{box-shadow:0 0 0 2px #3b82f6}</style>
</head>
<body class="bg-[#050505]" data-cp-marketing="replace-header">
<header></header>
<main class="max-w-6xl mx-auto px-6 py-16">
    <div class="text-center mb-16">
        <span class="text-xs font-bold text-amber-400 bg-amber-400/10 px-3 py-1 rounded-full">유료 · CloudFront 유사</span>
        <h1 class="text-5xl font-black mt-4 mb-4">Cache<span class="text-amber-400">Cloud</span></h1>
        <p class="text-gray-400 max-w-2xl mx-auto">호스팅 생성 시 전용 엣지 Worker가 배포되어 HTML·정적 자산을 글로벌 캐시합니다. AWS CloudFront와 동일한 역할을 Cloudflare 엣지에서 수행합니다.</p>
    </div>
    <div class="grid md:grid-cols-3 gap-6 mb-16">
        <div class="p-6 bg-[#111] border border-white/10 rounded-2xl"><i class="fas fa-globe text-amber-400 text-2xl mb-3"></i><h3 class="font-bold mb-2">엣지 캐싱</h3><p class="text-sm text-gray-500">전 세계 PoP에서 정적·동적 응답 캐시</p></div>
        <div class="p-6 bg-[#111] border border-white/10 rounded-2xl"><i class="fas fa-compress text-amber-400 text-2xl mb-3"></i><h3 class="font-bold mb-2">성능 최적화</h3><p class="text-sm text-gray-500">Cache-Control·stale-while-revalidate 자동</p></div>
        <div class="p-6 bg-[#111] border border-white/10 rounded-2xl"><i class="fas fa-shield-alt text-amber-400 text-2xl mb-3"></i><h3 class="font-bold mb-2">오리진 보호</h3><p class="text-sm text-gray-500">GitHub 레포·PHP Runner 부하 감소</p></div>
    </div>
    <h2 class="text-2xl font-bold text-center mb-8">요금</h2>
    <div id="pricing-grid" class="grid md:grid-cols-2 gap-6 max-w-3xl mx-auto"></div>
</main>
<script src="/src/marketing-shell.js"></script>
<script src="/src/product-page-shell.js"></script>
<script>
renderProductPricing([
  { name: "Standard", price: "₩12,900", features: ["사이트 1개", "엣지 Worker 자동 배포", "KV 캐시 1GB"], cta: "구독하기", onClick: "subscribeProduct('cachecloud','standard')" },
  { name: "Pro", price: "₩34,900", popular: true, features: ["사이트 무제한", "우선 캐시 무효화", "분석 대시보드"], cta: "구독하기", onClick: "subscribeProduct('cachecloud','pro')" },
], "pricing-grid");
</script>
</body>
</html>
