<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP3 | CloudPress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white" data-cp-marketing="replace-header">
<header></header>
<main class="max-w-6xl mx-auto px-6 py-16">
    <div class="text-center mb-16">
        <span class="text-xs font-bold text-green-400 bg-green-400/10 px-3 py-1 rounded-full">유료 · S3 유사</span>
        <h1 class="text-5xl font-black mt-4 mb-4">CP<span class="text-green-400">3</span></h1>
        <p class="text-gray-400 max-w-2xl mx-auto">GitHub 레포 기반 오브젝트 스토리지. DNS 플래너가 여러 스토리지 레포 중 최적 노드를 선택하고, 사용자·호스팅별로 완전 분리된 폴더를 제공합니다.</p>
    </div>
    <div class="grid md:grid-cols-2 gap-8 mb-12 text-sm text-gray-400">
        <div class="p-6 bg-[#111] border border-white/10 rounded-2xl">
            <h3 class="text-white font-bold mb-3">경로 구조 (AWS S3 버킷 유사)</h3>
            <pre class="text-xs text-green-300/80 bg-black/40 p-4 rounded-xl overflow-x-auto">storage/{user_id}/{site_id}/
  uploads/
  media/
  backups/</pre>
        </div>
        <div class="p-6 bg-[#111] border border-white/10 rounded-2xl">
            <h3 class="text-white font-bold mb-3">DNS 플래너</h3>
            <p>관리자가 등록한 GitHub 스토리지 레포를 헬스체크하고, 가중치(예: 30/30/40)에 따라 사용자를 자동 할당합니다.</p>
        </div>
    </div>
    <div id="pricing-grid" class="grid md:grid-cols-2 gap-6 max-w-3xl mx-auto"></div>
</main>
<script src="/src/marketing-shell.js"></script>
<script src="/src/product-page-shell.js"></script>
<script>
renderProductPricing([
  { name: "Standard", price: "₩7,900", features: ["50GB 스토리지", "호스팅별 폴더 분리", "GitHub 레포 샤딩"], cta: "구독하기", onClick: "subscribeProduct('cp3','standard')" },
  { name: "Pro", price: "₩19,900", popular: true, features: ["500GB", "CDN 연동", "버전 관리"], cta: "구독하기", onClick: "subscribeProduct('cp3','pro')" },
], "pricing-grid");
</script>
</body>
</html>
