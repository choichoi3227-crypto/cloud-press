<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudPress | 회원가입</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 공통 스타일 시트 -->
    <link rel="stylesheet" href="/style.css">
    <style>
        /* CDN 로딩 실패를 대비한 기본 배경색 설정 */
        body {
            background-color: #050505;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div class="w-full max-w-md bg-[#111] p-10 rounded-3xl border border-white/10 shadow-2xl">
        <div class="text-center mb-10">
            <a href="/" class="text-3xl font-black tracking-tighter text-blue-500">CLOUD<span class="text-white">PRESS</span></a>
            <p class="text-gray-500 mt-2 text-sm">초고속 클라우드프레스에 가입하세요.</p>
        </div>
        
        <form id="signupForm" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs text-gray-400 ml-1">이메일 주소</label>
                <input type="email" id="email" required placeholder="example@email.com" 
                    class="w-full p-4 bg-white/5 border border-white/10 rounded-xl focus:border-blue-500 outline-none transition text-white">
            </div>
            <div class="space-y-1">
                <label class="text-xs text-gray-400 ml-1">비밀번호</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full p-4 bg-white/5 border border-white/10 rounded-xl focus:border-blue-500 outline-none transition text-white">
            </div>
            
            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 py-4 rounded-xl font-bold hover:bg-blue-500 transition-all shadow-lg shadow-blue-600/20 mt-6 text-white">
                무료 계정 생성
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-500">
            이미 계정이 있나요? <a href="login.html" class="text-blue-500 hover:underline font-medium">로그인</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.innerText = "처리 중...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alert('가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
                    location.href = 'login.html';
                } else {
                    alert('가입 실패: ' + (data.error || '알 수 없는 오류'));
                }
            } catch (err) {
                console.error(err);
                alert('네트워크 오류가 발생했습니다. 서버 설정을 확인해주세요.');
            } finally {
                btn.innerText = "무료 계정 생성";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
