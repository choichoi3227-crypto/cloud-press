# CloudPress PHP Runner Worker — wrangler-php.toml
# 진짜 WordPress PHP를 php-wasm으로 실행하는 별도 Worker
#
# 배포 순서:
#   1. wrangler deploy --config wrangler-php.toml   ← 먼저 배포
#   2. wrangler deploy                               ← 메인 Worker 배포
#
# 메인 Worker에서 Service Binding으로 호출됨

name = "cloudpress-php"
main = "php-runner.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# php-wasm은 CPU 집약적 — 최대 CPU 시간 허용
[limits]
cpu_ms = 50000

[dev]
port = 8789
local_protocol = "http"

# ── KV: PHP 출력 캐시 & WordPress 코어 파일 캐시 ─────────────────────────────
# 메인 Worker와 동일한 KV 네임스페이스 공유
[[kv_namespaces]]
binding = "CACHE"
id      = "9b8370d20a9646b9aa73f63c9200379f"

# ── 환경변수 ──────────────────────────────────────────────────────────────────
[vars]
WP_VERSION  = "6.7.2"

# ── Secrets (wrangler secret put 으로 설정) ────────────────────────────────────
#
# wrangler secret put GITHUB_TOKEN --config wrangler-php.toml
#   ← 플랫폼 GitHub Token (사용자 레포 파일 읽기용)
#   ← 또는 각 사이트별 토큰은 PHP 실행 시 payload로 전달

[observability]
enabled = true

[observability.logs]
enabled            = true
head_sampling_rate = 1
persist            = true
invocation_logs    = true
