name = "cloudpress-search-endpoint"
main = "worker-search.js"
compatibility_date = "2026-05-14"

# Cloudflare Workers 무료 플랜 배포용 독립 설정입니다(검색 + 주제조사).
# 배포:
#   npx wrangler deploy -c wrangler-search.toml
# 로컬 테스트:
#   npx wrangler dev -c wrangler-search.toml

[observability]
enabled = false

# ── (선택) X-AIBP-Secret 인증 ──
#   npx wrangler secret put AIBP_SHARED_SECRET -c wrangler-search.toml

# ── Cloudflare Workers AI 바인딩 (/api/image 필수) ──
# /api/image는 스타일별 AI 아트 디렉터(LLM)가 이미지를 디자인하므로 이 바인딩이 필요합니다.
# (/api/research는 바인딩 없이도 동작하며, 있으면 요청당 최대 1회 결과를 보강합니다.)
[ai]
binding = "AI"

# ── SVG → PNG 변환용 한글 폰트(TTF)를 Data 모듈로 번들 ──
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true
