# CloudPress — wrangler.toml
# 플랫폼 메타데이터 Worker (Cloudflare Pages Functions)
#
# 호스팅 방식:
#   GitHub 레포 (스토리지) → Cloudflare Worker (dist/ 순수 미러링)
#   WordPress PHP → Astro SSR (GitHub Actions에서 자동 변환 + 빌드)
#   Astro SSR dist/ → GitHub 레포에 커밋 → Worker가 미러링
#
# DB:    Cloudflare D1 (플랫폼 메타데이터)
# Cache: Cloudflare KV (세션)
# PHP:   없음 — GitHub Actions에서 Astro SSR로 변환됨

name = "cloud-press"
main = "worker.js"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

# ── 정적 파일 서빙 (CloudPress 대시보드 HTML/CSS/JS) ─────────────────────────
[assets]
directory = "."
binding   = "ASSETS"

# ── D1: 플랫폼 메타데이터 DB ─────────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "cloudpress-db"
database_id   = "a04d0702-b6d8-49d3-8e57-b81ee5028ac7"

# ── KV: 세션 관리 ────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id      = "19e5e273e99941fbb963300e56dbdf9e"

# ── KV: 설치 상태 / 기타 ─────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id      = "9b8370d20a9646b9aa73f63c9200379f"

# ── Secrets (wrangler secret put 명령으로 설정) ───────────────────────────────
#
#   wrangler secret put JWT_SECRET
#     ← CloudPress 플랫폼 JWT 서명키
#
#   wrangler secret put GITHUB_TOKEN
#     ← GitHub Personal Access Token (레포 생성·파일 미러링용)
#     ← repo, workflow 권한 필요
#
#   wrangler secret put CF_API_TOKEN       (선택)
#     ← Cloudflare API 토큰 (Pages 프로젝트 자동 생성용)
#     ← Cloudflare Pages:Edit 권한 필요
#
#   wrangler secret put CF_ACCOUNT_ID     (선택)
#     ← Cloudflare 계정 ID

[vars]
# 플랫폼 도메인
PLATFORM_DOMAIN = "cloud-press.co.kr"

# WordPress → Astro 변환 활성화
ASTRO_CONVERT = "true"

[observability]
enabled            = false
head_sampling_rate = 1

[observability.logs]
enabled            = true
head_sampling_rate = 1
persist            = true
invocation_logs    = true

[observability.traces]
enabled            = false
persist            = true
head_sampling_rate = 1

[dev]
port           = 8788
local_protocol = "http"
