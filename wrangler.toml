# CloudPress — wrangler.toml
# 플랫폼 메타데이터 Worker (Cloudflare Pages Functions)
#
# 호스팅 방식:
#   GitHub 레포 (스토리지) → Cloudflare Pages (배포, 미러링)
#   실제 업로드 시 모든 파일을 GitHub 레포에 미러링
#
# DB:    Cloudflare D1 (플랫폼 메타데이터)
# Cache: Cloudflare KV (세션/PHP출력/정적자산)
# PHP:   cloudpress-php Service Binding (php-wasm)

name = "cloud-press"
main = "worker.js"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

# ── 정적 파일 서빙 (CloudPress 대시보드 HTML/CSS/JS) ─────────────────────────
[assets]
directory = "."
binding   = "ASSETS"

# ── D1: 플랫폼 메타데이터 DB ─────────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "cloudpress-db"
database_id   = "a04d0702-b6d8-49d3-8e57-b81ee5028ac7"

# ── KV: 세션 관리 ────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id      = "19e5e273e99941fbb963300e56dbdf9e"

# ── KV: PHP 출력 캐시 + 정적 자산 캐시 ──────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id      = "9b8370d20a9646b9aa73f63c9200379f"

# ── KV: 설치 상태 / 기타 ─────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id      = "9b8370d20a9646b9aa73f63c9200379f"

# ── PHP Runner: 진짜 WordPress PHP 실행 (php-wasm) ────────────────────────────
# 플랫폼 메인 Worker(cloud-press)는 PHP를 직접 실행하지 않습니다.
# PHP 실행은 각 사이트별 Worker가 cloudpress-php Service Binding으로 처리합니다.
#
# 배포 순서:
#   1. wrangler deploy --config wrangler-php.toml   ← cloudpress-php 먼저 배포
#   2. wrangler deploy                               ← 메인 플랫폼 Worker 배포
#
# (package.json의 "deploy" 스크립트가 이 순서를 자동으로 처리합니다)

# ── Secrets (wrangler secret put 명령으로 설정) ───────────────────────────────
#
#   wrangler secret put JWT_SECRET
#     ← CloudPress 플랫폼 JWT 서명키
#
#   wrangler secret put GITHUB_TOKEN
#     ← GitHub Personal Access Token (레포 생성·파일 미러링용)
#     ← repo, workflow 권한 필요
#
#   wrangler secret put CF_API_TOKEN       (선택)
#     ← Cloudflare API 토큰 (Pages 프로젝트 자동 생성용)
#     ← Cloudflare Pages:Edit 권한 필요
#
#   wrangler secret put CF_ACCOUNT_ID     (선택)
#     ← Cloudflare 계정 ID

[vars]
# 플랫폼 도메인 (Cloudflare Pages .pages.dev 또는 커스텀 도메인)
PLATFORM_DOMAIN = "cloud-press.co.kr"

# WordPress 버전
WP_VERSION = "latest"

[observability]
enabled            = false
head_sampling_rate = 1

[observability.logs]
enabled            = true
head_sampling_rate = 1
persist            = true
invocation_logs    = true

[observability.traces]
enabled            = false
persist            = true
head_sampling_rate = 1

[dev]
port           = 8788
local_protocol = "http"
