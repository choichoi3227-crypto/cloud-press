name = "cloud-press"
main = "worker.js"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

# ── 정적 파일 서빙 (CloudPress 대시보드 HTML/CSS/JS) ─────────────────────────
[assets]
directory = "."
binding   = "ASSETS"

# ── D1: 플랫폼 메타데이터 DB ─────────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "cloudpress-db"
database_id   = "a04d0702-b6d8-49d3-8e57-b81ee5028ac7"

# ── KV: 세션 관리 ────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id      = "19e5e273e99941fbb963300e56dbdf9e"

# ── KV: 설치 상태 / 기타 ─────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "KV"
id      = "9b8370d20a9646b9aa73f63c9200379f"

# ── Durable Objects: WordPress 관리자 (사용자당 1개) ─────────────────────────
# 역할: 설치관리, 상태관리, 세션, 락, 크론, DB 담당
[[durable_objects.bindings]]
name       = "WP_MANAGER"
class_name = "93a4b500a10e49d1b033af94065d8b12"
# script_name은 같은 worker이므로 생략

# Durable Object 마이그레이션 (최초 배포 시)
[[migrations]]
tag  = "v1"
new_classes = ["WpManager"]

# ── Secrets (wrangler secret put 명령으로 설정) ───────────────────────────────
#
#   wrangler secret put JWT_SECRET
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put CF_API_TOKEN      (선택)
#   wrangler secret put CF_ACCOUNT_ID     (선택)
#   wrangler secret put TOSS_SECRET_KEY
#   wrangler secret put PAYPAL_CLIENT_ID
#   wrangler secret put PAYPAL_SECRET
#   wrangler secret put R2_ACCESS_KEY_ID  (선택: R2 폴백 사용 시)
#   wrangler secret put R2_SECRET_KEY     (선택: R2 폴백 사용 시)
#   wrangler secret put CP3_GITHUB_TOKEN  (선택: CP3 전용 레포 사용 시)

[vars]
# 플랫폼 도메인
PLATFORM_DOMAIN = "cloud-press.co.kr"

# WordPress → Astro 변환 활성화
ASTRO_CONVERT = "true"

# PayPal 모드 (sandbox | live)
PAYPAL_MODE = "sandbox"

# R2 버킷 이름 (폴백 스토리지)
# R2_BUCKET = "cloudpress-fallback"
# R2_ACCOUNT_ID = ""

[observability]
enabled            = false
head_sampling_rate = 1

[observability.logs]
enabled            = true
head_sampling_rate = 1
persist            = true
invocation_logs    = true

[observability.traces]
enabled            = false
persist            = true
head_sampling_rate = 1

[dev]
port           = 8788
local_protocol = "http"
