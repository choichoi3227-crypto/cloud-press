name = "cloud-press"
main = "/src/index.js"
compatibility_date = "2024-05-01"

# ──────────────────────────────────────────────────────────────────────────────
# 정적 파일(HTML/CSS/JS) 서빙 - Workers Assets 바인딩
# HTML, CSS, JS 파일들이 Worker와 같은 도메인에서 서빙되어 /api/* 경로가 정상 동작함
# ──────────────────────────────────────────────────────────────────────────────
[assets]
directory = "."
binding = "ASSETS"

# ──────────────────────────────────────────────────────────────────────────────
# 환경 변수 (배포 전 실제 값으로 교체하세요)
# ──────────────────────────────────────────────────────────────────────────────
[vars]
ADMIN_DOMAIN = "admin.cloud-press.co.kr"
JWT_SECRET = "Swsh120327!"          # 반드시 강력한 값으로 변경!
CLOUDFLARE_ZONE_ID = "cloud-press.co.kr"    # CloudPress 서비스 Zone ID
CLOUDFLARE_API_TOKEN = "cfut_JN1fIDl5zRN9GJbsO7ntuQpc6QFA1TjJyDxUwrfU140bc101"     # Zone Edit 권한 토큰

# ──────────────────────────────────────────────────────────────────────────────
# KV Namespace 바인딩
# 생성: wrangler kv:namespace create CONFIG_KV
# id는 생성 후 출력된 값으로 교체하세요
# ──────────────────────────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "b31e68eb8d69407ab72351cd5d43232c"

# ──────────────────────────────────────────────────────────────────────────────
# D1 Database 바인딩
# 생성: wrangler d1 create cloudpress_db
# 마이그레이션: wrangler d1 execute cloudpress_db --file=./schema.sql
# database_id는 생성 후 출력된 값으로 교체하세요
# ──────────────────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "cloudpress_db"
database_id = "271e8d9a-ff7d-4c9b-8e72-523bd225d7d0"
