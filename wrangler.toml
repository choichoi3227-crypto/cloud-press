# CloudPress v3.0 — wrangler.toml
# 진짜 서버리스 WordPress on Cloudflare Workers
# PHP: WebAssembly (php-wasm 8.2)
# Storage: Supabase Storage
# DB: Cloudflare D1 (SQLite)
# Cache: Cloudflare KV

# ── 메인 플랫폼 Worker ────────────────────────────────────────────────────
name = "cloud-press"
main = "worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# ── 정적 파일 서빙 (CloudPress 대시보드 HTML/CSS/JS) ─────────────────────
[assets]
directory = "./"
binding   = "ASSETS"

# ── D1: 플랫폼 메타데이터 DB ─────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "cloudpress-db"
database_id   = "a04d0702-b6d8-49d3-8e57-b81ee5028ac7"

# ── KV: 세션 관리 ────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id      = "19e5e273e99941fbb963300e56dbdf9e"

# ── KV: 페이지 캐시 ─────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id      = "9b8370d20a9646b9aa73f63c9200379f"

# ── KV: WordPress 설치 큐 ────────────────────────────────────────────────
[[kv_namespaces]]
binding = "INSTALL_QUEUE"
id      = "f6ae966a71914956864e6ed452ddd9e4"

# ── KV: WordPress 설치 상태 (wp_installed:siteId) ────────────────────────
[[kv_namespaces]]
binding = "KV"
id      = "9b8370d20a9646b9aa73f63c9200379f"

# ── Service Binding: PHP Runner Worker ───────────────────────────────────
# php-wasm으로 실제 PHP를 실행하는 별도 Worker
# 먼저 php-runner worker를 배포한 후 아래 주석 해제
# [[services]]
# binding = "PHP_RUNNER"
# service = "cloudpress-php"

# ── 필수 secrets (wrangler secret put 명령으로 설정) ─────────────────────
#
#   wrangler secret put SUPABASE_URL
#     ← Supabase 프로젝트 URL (https://xxxx.supabase.co)
#     ← 반드시 설정! WordPress 파일 저장에 사용
#
#   wrangler secret put SUPABASE_SERVICE_KEY
#     ← Supabase service_role key (storage 접근용)
#     ← 반드시 설정!
#
#   wrangler secret put JWT_SECRET
#     ← CloudPress 플랫폼 JWT 서명키
#
#   wrangler secret put SUPABASE_MANAGEMENT_TOKEN   (선택)
#     ← Supabase Management API 토큰 (새 프로젝트 자동 생성)
#
#   wrangler secret put SUPABASE_ORG_ID             (선택)
#     ← Supabase 조직 ID

[vars]
SUPABASE_REGION = "ap-northeast-2"

[limits]
cpu_ms = 50000

[dev]
port           = 8788
local_protocol = "http"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
